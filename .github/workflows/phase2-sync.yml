name: Phase 2 data materialization (migration branch only)
on:
  push:
    branches: [refactor/phase-2-metadata]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate reconciled registry and audit (no legacy writes)
        run: PYTHONPATH=src python -m ael.reconcile apply
      - name: Validate generated registry
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
          PYTHONPATH=src python -m ael.registry validate
          PYTHONPATH=src python -m ael.reconcile check
      - name: Commit deterministic metadata snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/records.jsonl registry/audit-report.json
          if ! git diff --cached --quiet; then
            git commit -m "data(registry): reconcile legacy source metadata and publication inventory"
            git push origin HEAD:refactor/phase-2-metadata
          fi
