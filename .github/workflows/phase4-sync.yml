name: Phase 4 audit materialization (migration branch only)
on:
  push:
    branches: [refactor/phase-4-content-migration]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconcile migrated Registry
        run: PYTHONPATH=src python -m ael reconcile --write
      - name: Validate moved source, compatibility links, and complete pipeline
        run: |
          PYTHONPATH=src python -m ael.migration check
          PYTHONPATH=src python -m ael check
          PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Commit only generated metadata outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/records.jsonl registry/audit-report.json
          if ! git diff --cached --quiet; then
            git commit -m "data(registry): update paths and publication audit for research pilot"
            git push origin HEAD:refactor/phase-4-content-migration
          fi
