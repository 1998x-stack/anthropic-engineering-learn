name: Validate content registry

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Validate inventory and references
        run: PYTHONPATH=src python -m ael.registry validate
      - name: Check for unregistered content
        run: |
          test "$(PYTHONPATH=src python -m ael.registry sync | cut -d' ' -f1)" = "0"
      - name: Verify research migrations and compatibility links
        run: PYTHONPATH=src python -m ael.migration check
      - name: Check metadata and site inventory drift
        run: PYTHONPATH=src python -m ael.reconcile check
      - name: Verify unified pipeline plan and state
        run: |
          PYTHONPATH=src python -m ael plan
          PYTHONPATH=src python -m ael check
      - name: Build and validate deterministic site catalog
        run: |
          PYTHONPATH=src python -m ael publish --write
          PYTHONPATH=src python -m ael publish --check
