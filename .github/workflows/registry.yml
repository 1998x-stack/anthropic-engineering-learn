name: Validate content registry

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Validate inventory and references
        run: PYTHONPATH=src python -m ael.registry validate
      - name: Check for unregistered content
        run: |
          test "$(PYTHONPATH=src python -m ael.registry sync | cut -d' ' -f1)" = "0"
